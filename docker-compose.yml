version: '3.8'

services:
  uziptv:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=uziptv-docker-secret-key
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///data/uziptv.db
      - MAX_SEARCH_RESULTS=50
      - SEARCH_TIMEOUT=30
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - uziptv
    restart: unless-stopped

volumes:
  data:
