services:
  - type: web
    name: uziptv
    runtime: python3
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && gunicorn --bind 0.0.0.0:$PORT main:app
    plan: free
    env: python
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: uziptv-db
          property: connectionString
      - key: MAX_SEARCH_RESULTS
        value: 50
      - key: SEARCH_TIMEOUT
        value: 30

databases:
  - name: uziptv-db
    plan: free
    databaseName: uziptv
    user: uziptv_user

# Optional: Static site for documentation
  - type: static
    name: uziptv-docs
    staticPublishPath: ./docs
    buildCommand: echo "Documentation site"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
